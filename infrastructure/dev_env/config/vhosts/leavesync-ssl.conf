<VirtualHost *:443>
    ServerName leavesync.esof.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/leavesync.esof.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/leavesync.esof.net/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://node:3030/
    ProxyPassReverse / http://node:3030/

    ErrorLog ${APACHE_LOG_DIR}/leavesync-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/leavesync-ssl-access.log combined
</VirtualHost>
# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
