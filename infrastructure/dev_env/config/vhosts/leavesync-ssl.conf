<VirtualHost *:443>
    ServerName leavesync.esof.net
    ServerAlias www.leavesync.esof.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/leavesync.esof.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/leavesync.esof.net/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"

    Alias /.well-known/acme-challenge/ "/var/www/certbot/.well-known/acme-challenge/"
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass / http://node:3030/
    ProxyPassReverse / http://node:3030/

    ErrorLog ${APACHE_LOG_DIR}/leavesync-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/leavesync-ssl-access.log combined
</VirtualHost>
