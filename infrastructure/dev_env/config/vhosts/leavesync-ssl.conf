<VirtualHost *:443>
    ServerName leavesync.esof.net

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"

    DocumentRoot /var/www/html/starter/api/public

    <Directory /var/www/html/starter/api/public>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPass /api !
    ProxyPass /storage !

    ErrorLog ${APACHE_LOG_DIR}/leavesync-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/leavesync-ssl-access.log combined
</VirtualHost>
