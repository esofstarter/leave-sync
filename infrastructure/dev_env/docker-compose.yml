version: "3.8"
services:
  app:
    build:
      context: ./bin/app
      dockerfile: Dockerfile
      args:
        WWW_DATA_UID: ${UID}
        WWW_DATA_GID: ${GID}
    container_name: app
    restart: always
    ports:
      - ${HOST_MACHINE_UNSECURE_HOST_PORT}:80
      - ${HOST_MACHINE_SECURE_HOST_PORT}:443
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html/${PROJECT_NAME}
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - dev_env_letsencrypt:/etc/letsencrypt
      - dev_env_certbot_www:/var/www/certbot

    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      main:
        aliases:
          - ${PROJECT_NAME}.test

  database:
    build:
      context: ./bin/db
    container_name: database
    restart: unless-stopped
    command: >
      mysqld --log_error=/var/log/mysql/mysql_error.log
      --general_log_file=/var/log/mysql/mysql.log --general_log=1
      --slow_query_log=1 --slow_query_log_file=/var/log/mysql/mysql_slow.log
      --long_query_time=2 --log_queries_not_using_indexes=1
    ports:
      - 127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306
    networks:
      - main
    volumes:
      - ${MYSQL_DATA_DIR-./data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR-./logs/mysql}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

  node:
    build:
      context: ./bin/node
    container_name: node
    restart: always
    tty: true
    ports:
      - "5173:5173"
      - "3030:3030"
    networks:
      - main
    volumes:
      - ${DOCUMENT_ROOT-./www}:/usr/app
    working_dir: /usr/app
    environment:
      HOST: 0.0.0.0
      NODE_ENV: "development"

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - 127.0.0.1:${HOST_MACHINE_REDIS_PORT}:6379
    volumes:
      - ${REDIS_DATA_DIR-./data/redis}:/data
    networks:
      - main
  
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - dev_env_letsencrypt:/etc/letsencrypt
      - dev_env_certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do sleep 3600; done"
    networks:
      - main

networks:
  main:
    driver: bridge

volumes:
  dev_env_letsencrypt:
  dev_env_certbot_www:
